name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          CODE="${TAG#v}"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${TAG}"  >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > netaudit-release.jks

      - name: Write signing config
        run: |
          cat > keystore.properties <<EOF
          storeFile=netaudit-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "netaudit-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: netaudit-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Clean up secrets
        if: always()
        run: rm -f netaudit-release.jks keystore.properties
